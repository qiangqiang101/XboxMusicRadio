name: Build

# Builds XboxMusicRadio.dll and the FH2 Mod Platform it ships with, and packs them the way they go into the
# Azimuth folder:
#   DWrite.dll                       the FH2 Mod Platform (next to azimuth.exe; Azimuth 1.0.1 and later load it)
#   fh2-mods/XboxMusicRadio.dll      the mod
#   LICENSE*.txt                     the mod's and the platform's licenses
#
# Run by hand (Actions > Build > Run workflow): the zip is uploaded as an artifact of the run.
# Publishing a release: the zip is attached to it as XboxMusicRadio-<tag>.zip. The tag has to match the VERSION in
# CMakeLists.txt (v0.1.0 for 0.1.0), as that's the version the mod reports and compares with GitHub's.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20261020"
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Name the build
        id: name
        run: |
          version=$(sed -n 's/^project([^ ]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "CMakeLists.txt version: $version"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="${GITHUB_REF_NAME#[vV]}"
            if [[ "$tag" != "$version" ]]; then
              echo "::error::Release tag $GITHUB_REF_NAME doesn't match VERSION $version in CMakeLists.txt; bump it first."
              exit 1
            fi
            echo "name=XboxMusicRadio-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=XboxMusicRadio-v${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install llvm-mingw + ninja
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" -o llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/platform/cmake/mingw-w64-x86_64.cmake"
          cmake --build build --target xboxmusicradio fh2mod_platform

      - name: Stage dist/
        run: |
          mkdir -p dist/fh2-mods
          cp build/platform/DWrite.dll dist/
          cp build/XboxMusicRadio.dll dist/fh2-mods/
          cp LICENSE dist/LICENSE.txt
          cp platform/LICENSE dist/LICENSE-FH2ModPlatform.txt
          cp platform/third_party/minhook/LICENSE.txt dist/LICENSE-MinHook.txt
          (cd dist && find . -type f -printf '  %P\n' | sort)

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - name: Zip
        run: cd dist && zip -r -9 "../${{ needs.build.outputs.name }}.zip" .

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ needs.build.outputs.name }}.zip" --repo "$GITHUB_REPOSITORY" --clobber
